<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Shape Shifting: Vehicle Race</title>
<!--ytgame--><script src="https://www.youtube.com/game_api/v1"></script><!--/ytgame-->
<style>
/* Textless, minimal: every control is an icon or a colour. Words exist only as aria-labels. */
:root{color-scheme:dark;--ink:#fff;--glass:rgba(16,24,40,.42);--glass-hi:rgba(255,255,255,.92);--go:#ff7a1a;--go-deep:#c85400;
  --gold:#ffcf33;--silver:#d5dde6;--bronze:#d98c4a;--none:#8a93a3;--ground:#5d9b3c;--water:#2f8fd8;--air:#6aa9df;--open:#37e06a;--shut:#ff4848}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#3a9cf5}
#game-root{position:relative;width:100%;height:100%;height:100dvh;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#game-canvas{display:block;width:100%;height:100%}
[hidden]{display:none!important}
button{color:var(--ink);border:0;padding:0;cursor:pointer;background:none;min-width:44px;min-height:44px;touch-action:manipulation;display:grid;place-items:center}
button:focus-visible{outline:3px solid var(--glass-hi);outline-offset:3px}
svg{display:block;fill:currentColor}
.line{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;
  padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.hud button{pointer-events:auto}
.top{display:flex;align-items:center;gap:12px}
.place{width:30px;height:30px;border-radius:50%;background:var(--medal,var(--gold));box-shadow:inset 0 0 0 3px #fff7,0 2px 6px #0004;transition:background .25s;flex:none}
.track{position:relative;flex:1;height:6px;border-radius:3px;background:var(--glass);margin:0 8px}
.track::after{content:"";position:absolute;right:-7px;top:-6px;width:14px;height:18px;border-radius:2px;
  background:conic-gradient(#fff 0 25%,#222 0 50%,#fff 0 75%,#222 0) 0 0/7px 6px}
.dot{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;box-shadow:0 0 0 2px #fff}
#dot0{background:var(--go);width:20px;height:20px;margin:-10px 0 0 -10px;z-index:2;box-shadow:0 0 0 3px #fff,0 2px 6px #0005}
#dot1{background:#2f80ed}#dot2{background:#d83f87}
.icon{width:42px;height:42px;border-radius:50%;background:var(--glass)}
.icon svg{width:22px;height:22px}
.bottom{display:flex;flex-direction:column;gap:12px;align-items:center}
.fork{display:flex;gap:12px}
.fork button{width:70px;height:50px;border-radius:25px;background:var(--glass);color:var(--ink);display:flex;gap:4px;justify-content:center;align-items:center;transition:background .15s,color .15s,transform .15s}
.fork button svg{width:24px;height:24px}
.fork button[aria-pressed=true]{background:var(--glass-hi);color:#1b2333;transform:scale(1.08)}
.lamp{width:12px;height:12px;border-radius:50%;background:var(--shut);box-shadow:0 0 8px currentColor;color:var(--shut);transition:background .2s}
.lamp.open{background:var(--open);color:var(--open)}
.slots{display:flex;gap:14px;justify-content:center}
.slot{position:relative;width:clamp(76px,23vw,98px);height:clamp(76px,23vw,98px);border-radius:28%;box-shadow:0 5px 0 #0003;transition:transform .12s,opacity .2s,box-shadow .12s}
.slot img{width:100%;height:100%;border-radius:28%;pointer-events:none}
.s0{background:var(--ground)}.s1{background:var(--water)}.s2{background:var(--air)}
.slot[aria-pressed=true]{transform:translateY(-7px) scale(1.06);box-shadow:0 9px 0 #0003,0 0 0 4px var(--glass-hi)}
.slot.unusable{opacity:.4;filter:saturate(.4)}
.slot:active{transform:translateY(-2px) scale(.96)}
.slot.nope{animation:nope .3s}
@keyframes nope{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
/* Wordless tutorial: a tap ripple on the vehicle to pick. */
.slot.hint::before{content:"";position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;border-radius:50%;background:#fff;opacity:.95;animation:tapdot 1s ease-in-out infinite;z-index:2}
.slot.hint::after{content:"";position:absolute;inset:-8px;border-radius:32%;border:4px solid #fff;animation:ring 1s ease-out infinite}
@keyframes tapdot{50%{transform:scale(.7)}}
@keyframes ring{0%{opacity:1;transform:scale(.9)}100%{opacity:0;transform:scale(1.15)}}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  background:radial-gradient(circle at 50% 55%,#0000 30%,#0007);padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#title{justify-content:flex-end;padding-bottom:max(18vh,env(safe-area-inset-bottom))}
.corner{position:absolute;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right))}
.row{display:flex;align-items:center;gap:22px}
.play{position:relative;width:112px;height:112px;border-radius:50%;background:var(--go);box-shadow:0 7px 0 var(--go-deep),0 14px 30px #0005}
.play svg{width:52px;height:52px;margin-left:6px}
.play:not(:disabled){animation:breathe 1.6s ease-in-out infinite}
.play:active{transform:translateY(4px);box-shadow:0 3px 0 var(--go-deep)}
.play:disabled{background:var(--glass);box-shadow:none}
.play:disabled svg{opacity:0}
.play:disabled::after{content:"";position:absolute;width:52px;height:52px;border-radius:50%;border:5px solid #fff3;border-top-color:#fff;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
@keyframes breathe{50%{transform:scale(1.06)}}
.small{width:64px;height:64px;border-radius:50%;background:var(--glass)}
.small svg{width:30px;height:30px}
.sound .off,.sound[aria-pressed=false] .on{display:none}
.sound[aria-pressed=false] .off{display:block}
.medal{width:150px;height:175px;filter:drop-shadow(0 10px 18px #0006);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.medal .disc{fill:var(--medal,var(--gold))}
@keyframes pop{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
#problem{width:64px;height:64px;color:var(--gold)}
/* Daily course: a gold sun marks the button that starts it, the race itself, and the streak on the result. */
.play .badge{position:absolute;top:-8px;right:-8px;width:42px;height:42px;margin:0;color:var(--gold);filter:drop-shadow(0 2px 3px #0007);display:none}
.play.daily .badge{display:block;animation:spin 8s linear infinite}
.mark{width:28px;height:28px;color:var(--gold);flex:none;filter:drop-shadow(0 1px 2px #0006)}
.streak{display:flex;align-items:center;gap:9px}
.streak svg{width:30px;height:30px;color:var(--gold)}
.streak i{width:14px;height:14px;border-radius:50%;background:var(--glass);box-shadow:0 0 0 2px #fff6}
.streak i.on{background:var(--gold);box-shadow:0 0 0 2px #fff,0 0 10px var(--gold)}
@media (orientation:landscape) and (max-height:520px){
  .bottom{flex-direction:row;align-items:flex-end;justify-content:center;gap:18px}
  .fork{flex-direction:column;gap:8px}.fork button{width:60px;height:42px}
  .slot{width:clamp(62px,19vh,88px);height:clamp(62px,19vh,88px)}
  #title{padding-bottom:max(10vh,env(safe-area-inset-bottom))}
  .play{width:92px;height:92px}.medal{width:110px;height:128px}.overlay{gap:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7.5 4.8v14.4a.8.8 0 0 0 1.2.7l11.3-7.2a.8.8 0 0 0 0-1.4L8.7 4.1a.8.8 0 0 0-1.2.7z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1.4"/><rect x="14" y="4.5" width="4" height="15" rx="1.4"/></symbol>
  <symbol id="i-replay" viewBox="0 0 24 24"><path class="line" d="M5.6 9.2A7.3 7.3 0 1 1 5 14"/><path class="line" d="M5 4.6v4.9h4.9"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path class="line" d="M14.5 5.5 8 12l6.5 6.5"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path class="line" d="m9.5 5.5 6.5 6.5-6.5 6.5"/></symbol>
  <symbol id="i-wind" viewBox="0 0 24 24"><path class="line" d="M3 12c2.2-4.5 4.4-4.5 6 0s3.8 4.5 6 0 3.8-4.5 6 0"/></symbol>
  <symbol id="i-sound" viewBox="0 0 24 24"><path d="M3.5 9.2h3.6l4.7-4v13.6l-4.7-4H3.5z"/><path class="line" d="M15.4 9a4.2 4.2 0 0 1 0 6M18.2 6.3a8 8 0 0 1 0 11.4"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path class="line" d="M12 1.8v3M12 19.2v3M1.8 12h3M19.2 12h3M4.8 4.8l2.1 2.1M17.1 17.1l2.1 2.1M4.8 19.2l2.1-2.1M17.1 6.9l2.1-2.1"/></symbol>
  <symbol id="i-mute" viewBox="0 0 24 24"><path d="M3.5 9.2h3.6l4.7-4v13.6l-4.7-4H3.5z"/><path class="line" d="m15.5 9.5 5 5m0-5-5 5"/></symbol>
</svg>
<div id="game-root">
  <canvas id="game-canvas" aria-label="Race"></canvas>
  <div id="hud" class="hud" hidden>
    <div class="top">
      <i id="place" class="place" role="img" aria-label="Position"></i>
      <svg id="dailyMark" class="mark" role="img" aria-label="Daily course" hidden><use href="#i-sun"/></svg>
      <div class="track" aria-hidden="true"><i id="dot1" class="dot"></i><i id="dot2" class="dot"></i><i id="dot0" class="dot"></i></div>
      <button id="pause" class="icon" aria-label="Pause"><svg><use href="#i-pause"/></svg></button>
    </div>
    <div class="bottom">
      <div id="fork" class="fork" hidden>
        <button data-branch="0" aria-label="Direct route through the gate"><svg><use href="#i-left"/></svg><i id="lamp" class="lamp"></i></button>
        <button data-branch="1" aria-label="Winding bypass"><svg><use href="#i-wind"/></svg><svg><use href="#i-right"/></svg></button>
      </div>
      <div class="slots">
        <button id="slot0" class="slot s0" data-slot="0" aria-pressed="false" aria-label="Ground"><img alt="" src=""></button>
        <button id="slot1" class="slot s1" data-slot="1" aria-pressed="false" aria-label="Water"><img alt="" src=""></button>
        <button id="slot2" class="slot s2" data-slot="2" aria-pressed="false" aria-label="Air"><img alt="" src=""></button>
      </div>
    </div>
  </div>
  <div id="title" class="overlay">
    <button class="icon sound corner" aria-label="Sound" aria-pressed="true"><svg class="on"><use href="#i-sound"/></svg><svg class="off"><use href="#i-mute"/></svg></button>
    <svg id="problem" viewBox="0 0 24 24" role="img" aria-label="Saved progress could not be read" hidden><path d="M12 3 2 20.5h20z" class="line"/><path class="line" d="M12 9.5v5"/><circle cx="12" cy="17.6" r="1.4"/></svg>
    <button id="play" class="play" aria-label="Play" disabled><svg><use href="#i-play"/></svg><svg class="badge" aria-hidden="true"><use href="#i-sun"/></svg></button>
  </div>
  <div id="result" class="overlay" hidden>
    <svg id="medal" class="medal" viewBox="0 0 120 140" role="img" aria-label="Medal">
      <path d="M36 0h20l15 46H51z" fill="#e8434f"/><path d="M84 0H64L49 46h20z" fill="#2f80ed"/>
      <circle class="disc" cx="60" cy="88" r="44"/><circle cx="60" cy="88" r="34" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="5"/>
      <polygon fill="#fff" fill-opacity=".75" points="60.0,71.0 64.1,82.3 76.2,82.7 66.7,90.2 70.0,101.8 60.0,95.0 50.0,101.8 53.3,90.2 43.8,82.7 55.9,82.3"/>
    </svg>
    <div id="streak" class="streak" role="img" aria-label="Daily streak" hidden><svg><use href="#i-sun"/></svg><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="row">
      <button id="replay" class="small" aria-label="Replay"><svg><use href="#i-replay"/></svg></button>
      <button id="next" class="play" aria-label="Next race"><svg><use href="#i-play"/></svg><svg class="badge" aria-hidden="true"><use href="#i-sun"/></svg></button>
    </div>
  </div>
  <div id="paused" class="overlay" hidden>
    <div class="row">
      <button class="small sound" aria-label="Sound" aria-pressed="true"><svg class="on"><use href="#i-sound"/></svg><svg class="off"><use href="#i-mute"/></svg></button>
      <button id="resume" class="play" aria-label="Resume"><svg><use href="#i-play"/></svg></button>
    </div>
  </div>
</div>
<script type="module" src="game.js"></script>
</body>
</html>
